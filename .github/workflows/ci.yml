# =============================================================================
# CI — Refract
# =============================================================================
# Estratégia v1 (pragmática):
#
# 1. npm install --ignore-scripts — o postinstall do repo faz rebuild nativo
#    (Rust + electron-rebuild) e baixa ~300MB de modelos Whisper/transformers.
#    Nenhum passo do CI precisa disso: esbuild transpila sem ABI nativa e os
#    tiers de teste abaixo são JS puro (verificado: sem better-sqlite3/keytar/
#    sharp na cadeia de imports de electron/llm, electron/intelligence e
#    src/lib).
#
# 2. Blocking vs advisory — estado medido em 2026-09-05 (Linux, Node 22):
#      renderer typecheck ... 0 erros ✅            → blocking
#      typecheck:electron ... 0 erros ✅            → blocking
#      renderer tier ........ 135/135 ✅            → blocking
#      llm tier ............. ~20 falhas conhecidas → advisory
#      intelligence tier .... 28 falhas conhecidas  → advisory
#    typecheck:electron foi promovido a blocking: a nota antiga de "14 erros
#    pré-existentes" não se sustenta mais (medido: 0 erros). Se voltar a
#    falhar, é regressão real e deve ser corrigida, não silenciada.
#    As falhas dos tiers advisory incluem testes que dependem de g++ no PATH,
#    mutação de process.env entre arquivos e fixtures sensíveis a data —
#    nada relacionado a mudanças recentes. Promoção para blocking acontece
#    tier a tier quando zeradas. Nota: contagens podem diferir no Windows.
#
# 3. A suíte completa de services (npm test) NÃO roda: contém testes que
#    sobem subsistemas inteiros (ex.: IntelligenceEngineScreenContext
#    inicializa LLMHelper + DatabaseManager e pendura o runner).
#
# 4. Node 24 para casar com o ambiente de dev onde os tiers foram validados.
#
# 5. `premium/` é um submódulo proprietário e está AUSENTE em checkouts
#    públicos (o remote Natively-AI-assistant/natively-premium não existe
#    mais). scripts/build-electron.js marca os requires relativos
#    (`../premium/…`, `../../premium/…`) como externos no esbuild, então o
#    build passa com ou sem o submódulo: com ele, os arquivos compilam para
#    dist-electron/premium/… e resolvem normalmente; sem ele, o require
#    lança em tempo de execução e cai no try/catch que todo call site já
#    tem. Ver docs/ANALISE_TECNICA_2026-09-04.md.
#
# Próximos passos naturais: zerar as falhas conhecidas e promover os tiers
# a blocking, matrix windows-latest/macos-latest, tier de services com
# timeout por arquivo (hoje ele pendura o runner).
# =============================================================================
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: typecheck + build + unit tiers
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies (sem scripts nativos)
        run: npm install --ignore-scripts

      - name: Typecheck renderer
        run: npx tsc --noEmit

      # Blocking desde 2026-09-05: medido em 0 erros. A nota antiga de "14
      # erros pré-existentes" estava desatualizada.
      - name: Typecheck electron
        run: npm run typecheck:electron

      - name: Build electron (esbuild)
        run: npm run build:electron

      - name: Build renderer (vite)
        run: npx vite build

      - name: Unit tests — renderer tier (blocking)
        run: node --test "src/lib/__tests__/**/*.test.mjs"

      # Advisory: 21 falhas pré-existentes (validado em Windows/Node 24) —
      # ver cabeçalho do arquivo. Verificar se o número cresce em reviews.
      - name: Unit tests — LLM tier (advisory)
        run: node --test "electron/llm/__tests__/**/*.test.mjs" "electron/llm/codeVerification/__tests__/**/*.test.mjs"
        continue-on-error: true

      # Advisory: 28 falhas pré-existentes — ver cabeçalho do arquivo.
      - name: Unit tests — intelligence tier (advisory)
        run: node --test "electron/intelligence/__tests__/**/*.test.mjs"
        continue-on-error: true
