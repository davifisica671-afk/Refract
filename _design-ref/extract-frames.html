<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Frame Extractor</title></head>
<body style="margin:0;background:#000">
<video id="v" style="display:none" src="file:///C:/Users/davif/Downloads/cluely.mp4" crossorigin="anonymous"></video>
<canvas id="c"></canvas>
<script>
const v=document.getElementById('v'), c=document.getElementById('c'), ctx=c.getContext('2d');
c.width=1920; c.height=1080;
let i=0;
const fps=1/3; // 1 frame every 3s
v.addEventListener('loadedmetadata',()=>{v.currentTime=0;});
v.addEventListener('seeked',()=>{
  ctx.drawImage(v,0,0,c.width,c.height);
  const link=document.createElement('a');
  link.download=`frame_${String(i).padStart(3,'0')}.png`;
  link.href=c.toDataURL('image/png');
  link.click();
  i++;
  if(v.currentTime<v.duration-fps){v.currentTime+=fps;}
  else{document.title='DONE:'+i;}
});
v.load();
</script></body></html>
